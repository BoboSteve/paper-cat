<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="一只捧着空钱包的小猫：只在 Windows 上测过">
  <title>只在 Windows 上测过的小猫</title>
  <!-- ears -->
  <path d="M62 70 L74 28 L100 58 Z" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M178 70 L166 28 L140 58 Z" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M71 60 L77 40 L90 56 Z" fill="#f4a6a6"/>
  <path d="M169 60 L163 40 L150 56 Z" fill="#f4a6a6"/>
  <!-- head -->
  <ellipse cx="120" cy="92" rx="62" ry="50" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3"/>
  <!-- eyes: teary -->
  <path d="M90 86 q8 -9 16 0" fill="none" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M134 86 q8 -9 16 0" fill="none" stroke="#3b2a1a" stroke-width="4" stroke-linecap="round"/>
  <path d="M93 92 q-3 10 1 14 q5 -4 1 -14 Z" fill="#7cc6f2"/>
  <path d="M147 92 q-3 10 1 14 q5 -4 1 -14 Z" fill="#7cc6f2"/>
  <!-- blush -->
  <ellipse cx="84" cy="104" rx="9" ry="5" fill="#f4a6a6" opacity="0.8"/>
  <ellipse cx="156" cy="104" rx="9" ry="5" fill="#f4a6a6" opacity="0.8"/>
  <!-- mouth -->
  <path d="M112 104 q8 6 16 0" fill="none" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- empty wallet held by paws -->
  <rect x="86" y="130" width="68" height="42" rx="8" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
  <path d="M86 146 h68" stroke="#4e342e" stroke-width="3"/>
  <circle cx="142" cy="154" r="4" fill="#ffd54f"/>
  <ellipse cx="88" cy="150" rx="11" ry="9" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3"/>
  <ellipse cx="152" cy="150" rx="11" ry="9" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3"/>
  <!-- moth flying out of the wallet -->
  <g fill="#cfd8dc" stroke="#78909c" stroke-width="1.5">
    <ellipse cx="190" cy="122" rx="9" ry="6" transform="rotate(-25 190 122)"/>
    <ellipse cx="200" cy="128" rx="9" ry="6" transform="rotate(25 200 128)"/>
  </g>
  <!-- Windows-only badge -->
  <g transform="translate(18 132)">
    <rect x="0" y="0" width="22" height="22" fill="#4fc3f7"/>
    <path d="M0 11 h22 M11 0 v22" stroke="#fff" stroke-width="2.5"/>
  </g>
  <text x="120" y="194" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b4a2b">仅 Windows 实测 · 其余靠理论 ✨</text>
</svg>
