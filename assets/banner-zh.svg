<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="论文喵 PaperCat：一句话，两分钟，拿到一份好看的论文速递">
  <title>论文喵 PaperCat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#2d4a7a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.06">
    <circle cx="1120" cy="40" r="90"/><circle cx="60" cy="330" r="70"/><circle cx="700" cy="-20" r="60"/>
  </g>

  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
    <text x="64" y="104" font-size="56" font-weight="800" fill="#ffffff">论文喵<tspan dx="18" font-size="40" font-weight="700" fill="#ffd166" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">PaperCat</tspan></text>
    <text x="66" y="156" font-size="28" fill="#dbe6ff">一句话，两分钟，拿到一份好看的论文速递</text>
    <text x="66" y="196" font-size="18" fill="#9fb4dc">想要可引用的结论？一键升级：全文通读 + 原文证据逐字核对</text>
    <g font-size="17" font-weight="600">
      <rect x="64" y="236" width="118" height="38" rx="19" fill="#ffd166"/>
      <text x="123" y="261" text-anchor="middle" fill="#3a2a00">⚡ 零配置</text>
      <rect x="194" y="236" width="160" height="38" rx="19" fill="#ffffff" opacity="0.14"/>
      <text x="274" y="261" text-anchor="middle" fill="#ffffff">📄 全文逐字核对</text>
      <rect x="366" y="236" width="176" height="38" rx="19" fill="#ffffff" opacity="0.14"/>
      <text x="454" y="261" text-anchor="middle" fill="#ffffff">🏷️ CCF · 中科院分区</text>
      <rect x="554" y="236" width="140" height="38" rx="19" fill="#ffffff" opacity="0.14"/>
      <text x="624" y="261" text-anchor="middle" fill="#ffffff">💬 小红书口碑</text>
    </g>
    <text x="66" y="318" font-size="15" fill="#8ea3cc">所有学科可用 · 计算机方向深度定制 · Claude Code / Codex</text>
  </g>

  <g transform="translate(820 52)">
    <g transform="rotate(-8 140 130)" filter="url(#shadow)">
      <rect x="40" y="30" width="230" height="200" rx="16" fill="#c9d6ee"/>
    </g>
    <g transform="rotate(4 140 130)" filter="url(#shadow)">
      <rect x="50" y="22" width="230" height="200" rx="16" fill="#e3eaf6"/>
    </g>
    <!-- cat peeking over the top card -->
    <g stroke="#6b4a2b" stroke-width="3" stroke-linejoin="round">
      <path d="M118 22 L128 -14 L150 10 Z" fill="#f7c58b"/>
      <path d="M202 22 L192 -14 L170 10 Z" fill="#f7c58b"/>
      <ellipse cx="160" cy="34" rx="50" ry="38" fill="#f7c58b"/>
    </g>
    <path d="M126 12 L130 -4 L141 9 Z" fill="#f4a6a6"/>
    <path d="M194 12 L190 -4 L179 9 Z" fill="#f4a6a6"/>
    <path d="M138 30 q7 -8 14 0" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M168 30 q7 -8 14 0" fill="none" stroke="#3b2a1a" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="132" cy="40" rx="7" ry="4" fill="#f4a6a6" opacity="0.85"/>
    <ellipse cx="188" cy="40" rx="7" ry="4" fill="#f4a6a6" opacity="0.85"/>
    <g filter="url(#shadow)">
      <rect x="44" y="44" width="236" height="200" rx="16" fill="url(#card)"/>
      <rect x="66" y="70" width="70" height="18" rx="9" fill="#dbe7ff"/>
      <rect x="66" y="100" width="180" height="12" rx="6" fill="#2d4a7a"/>
      <rect x="66" y="120" width="140" height="12" rx="6" fill="#2d4a7a" opacity="0.75"/>
      <rect x="66" y="146" width="190" height="8" rx="4" fill="#9aa8bf"/>
      <rect x="66" y="162" width="170" height="8" rx="4" fill="#9aa8bf"/>
      <rect x="66" y="186" width="180" height="40" rx="8" fill="#eaf6ee"/>
      <text x="80" y="212" font-size="15" fill="#1e7a3c" font-family="'PingFang SC','Microsoft YaHei',sans-serif">✓ 已在原文第 3 页核对</text>
    </g>
    <!-- paws on the card edge -->
    <ellipse cx="136" cy="46" rx="12" ry="8" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3"/>
    <ellipse cx="184" cy="46" rx="12" ry="8" fill="#f7c58b" stroke="#6b4a2b" stroke-width="3"/>
    <g transform="translate(250 128)">
      <circle cx="0" cy="0" r="42" fill="#ffffff" fill-opacity="0.25" stroke="#ffd166" stroke-width="10"/>
      <line x1="30" y1="30" x2="66" y2="66" stroke="#ffd166" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
